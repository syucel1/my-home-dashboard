spring:
  application:
    name: home-hub
  threads:
    virtual:
      enabled: true          # Java 25 virtual threads for request handling

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true        # /actuator/health/liveness and /readiness for Docker health checks
  info:
    java:
      enabled: true
